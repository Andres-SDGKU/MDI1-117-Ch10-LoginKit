name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Report toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Select an iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          devices = json.loads((Path(os.environ['RUNNER_TEMP']) / 'devices.json').read_text())['devices']

          def version(runtime):
              match = re.search(r'iOS-(\d+)-(\d+)', runtime)
              return tuple(int(n) for n in match.groups()) if match else (0, 0)

          candidates = [(version(runtime), d) for runtime, entries in devices.items() if '.iOS-' in runtime
                        for d in entries if d['isAvailable'] and d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iPhone simulator on this runner')
          newest = max(v for v, _ in candidates)
          device = next(d for v, d in candidates if v == newest)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f"SIMULATOR_ID={device['udid']}\n")
          print(f"Selected {device['name']} · iOS {newest[0]}.{newest[1]} ({device['udid']})")
          PY

      - name: Boot simulator
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Run tests
        run: >-
          xcodebuild test
          -project LoginKit/LoginKit.xcodeproj
          -scheme "LoginKit"
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -parallel-testing-enabled NO
          -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
          overwrite: true
